<svg xmlns="http://www.w3.org/2000/svg"
     width="880" height="240" viewBox="0 0 880 240"
     role="img" aria-labelledby="title desc">
  <title id="title">Selected Analytics and AI Dossiers</title>
  <desc id="description">
    An interactive Figma-inspired component inspector cycling smoothly through four
    projects: Port Cargo SARIMA, Retail Revenue BI, WellNest AI, and NutriGPT.
  </desc>

  <defs>
    <pattern id="dotField" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#d0d7de" opacity="0.45"/>
    </pattern>
    <linearGradient id="moodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8250df"/>
      <stop offset="100%" stop-color="#bf3989"/>
    </linearGradient>
    <clipPath id="stageClip">
      <rect x="324" y="0" width="556" height="240" rx="12"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .selector { animation: moveSelector 14s cubic-bezier(0.22, 1, 0.36, 1) infinite; }

    .seg1 { animation: segOne 14s linear infinite; }
    .seg2 { animation: segTwo 14s linear infinite; }
    .seg3 { animation: segThree 14s linear infinite; }
    .seg4 { animation: segFour 14s linear infinite; }

    .num1 { animation: numOne 14s linear infinite; }
    .num2 { animation: numTwo 14s linear infinite; }
    .num3 { animation: numThree 14s linear infinite; }
    .num4 { animation: numFour 14s linear infinite; }

    .slide1 { animation: showS1 14s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .slide2 { animation: showS2 14s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .slide3 { animation: showS3 14s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .slide4 { animation: showS4 14s cubic-bezier(0.22, 1, 0.36, 1) infinite; }

    @keyframes moveSelector {
      0%, 21% { transform: translateY(0px); }
      25%, 46% { transform: translateY(47px); }
      50%, 71% { transform: translateY(94px); }
      75%, 96% { transform: translateY(141px); }
      100% { transform: translateY(0px); }
    }

    @keyframes segOne {
      0%, 22% { opacity: 1; }
      24%, 98% { opacity: 0.2; }
      100% { opacity: 1; }
    }
    @keyframes segTwo {
      0%, 23% { opacity: 0.2; }
      25%, 47% { opacity: 1; }
      49%, 100% { opacity: 0.2; }
    }
    @keyframes segThree {
      0%, 48% { opacity: 0.2; }
      50%, 72% { opacity: 1; }
      74%, 100% { opacity: 0.2; }
    }
    @keyframes segFour {
      0%, 73% { opacity: 0.2; }
      75%, 97% { opacity: 1; }
      99%, 100% { opacity: 0.2; }
    }

    @keyframes numOne {
      0%, 22% { opacity: 1; }
      24%, 98% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes numTwo {
      0%, 23% { opacity: 0; }
      25%, 47% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @keyframes numThree {
      0%, 48% { opacity: 0; }
      50%, 72% { opacity: 1; }
      74%, 100% { opacity: 0; }
    }
    @keyframes numFour {
      0%, 73% { opacity: 0; }
      75%, 97% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }

    @keyframes showS1 {
      0% { opacity: 0; transform: translateY(6px); }
      3%, 21% { opacity: 1; transform: translateY(0px); }
      24%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes showS2 {
      0%, 24% { opacity: 0; transform: translateY(6px); }
      28%, 46% { opacity: 1; transform: translateY(0px); }
      49%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes showS3 {
      0%, 49% { opacity: 0; transform: translateY(6px); }
      53%, 71% { opacity: 1; transform: translateY(0px); }
      74%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes showS4 {
      0%, 74% { opacity: 0; transform: translateY(6px); }
      78%, 96% { opacity: 1; transform: translateY(0px); }
      99%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .selector, .seg1, .seg2, .seg3, .seg4, .num1, .num2, .num3, .num4, .slide1, .slide2, .slide3, .slide4 { animation: none; }
      .selector { transform: translateY(0px); }
      .seg1, .num1, .slide1 { opacity: 1; transform: none; }
      .seg2, .seg3, .seg4 { opacity: 0.2; }
      .num2, .num3, .num4, .slide2, .slide3, .slide4 { opacity: 0; }
    }
  </style>

  <!-- Left Rail: Component Layer Selector -->
  <rect x="0.5" y="0.5" width="307" height="239" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="18" y="26" class="mono" font-size="10.5" font-weight="700" fill="#818b98">
    DOSSIERS · INDEX
  </text>

  <!-- Animated Active Row Pill -->
  <g class="selector">
    <rect x="10" y="42" width="288" height="42" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="10" y="49" width="3" height="28" rx="1.5" fill="#0969da"/>
  </g>

  <!-- Static Row Labels -->
  <g class="sans" font-size="13" font-weight="600">
    <text x="24" y="67" class="mono" font-size="11" fill="#818b98">01</text>
    <text x="46" y="67" fill="#1f2328">Port Cargo SARIMA</text>
    <text x="286" y="67" text-anchor="end" class="mono" font-size="11" fill="#1a7f37">96.4%</text>

    <text x="24" y="114" class="mono" font-size="11" fill="#818b98">02</text>
    <text x="46" y="114" fill="#1f2328">Retail Revenue BI</text>
    <text x="286" y="114" text-anchor="end" class="mono" font-size="11" fill="#9a6700">+24.8%</text>

    <text x="24" y="161" class="mono" font-size="11" fill="#818b98">03</text>
    <text x="46" y="161" fill="#1f2328">WellNest AI</text>
    <text x="286" y="161" text-anchor="end" class="mono" font-size="11" fill="#bf3989">94.2%</text>

    <text x="24" y="208" class="mono" font-size="11" fill="#818b98">04</text>
    <text x="46" y="208" fill="#1f2328">NutriGPT RAG</text>
    <text x="286" y="208" text-anchor="end" class="mono" font-size="11" fill="#0598a2">8K+ items</text>
  </g>

  <!-- Active number highlights synced with selector -->
  <g class="mono" font-size="11" font-weight="700" fill="#0969da">
    <text class="num1" x="24" y="67">01</text>
    <text class="num2" x="24" y="114">02</text>
    <text class="num3" x="24" y="161">03</text>
    <text class="num4" x="24" y="208">04</text>
  </g>

  <!-- Right Stage: Live Cross-Fading Preview Canvas -->
  <g clip-path="url(#stageClip)">
    <rect x="324" y="0" width="556" height="240" rx="12" fill="#f6f8fa"/>
    <rect x="324" y="0" width="556" height="240" fill="url(#dotField)"/>

    <!-- 4-step segmented progress bar -->
    <g fill="#0969da">
      <rect class="seg1" x="344" y="18" width="124" height="3" rx="1.5"/>
      <rect class="seg2" x="474" y="18" width="124" height="3" rx="1.5"/>
      <rect class="seg3" x="604" y="18" width="124" height="3" rx="1.5"/>
      <rect class="seg4" x="734" y="18" width="124" height="3" rx="1.5"/>
    </g>

    <!-- SLIDE 1: Port Cargo SARIMA -->
    <g class="slide1">
      <text x="344" y="50" class="mono" font-size="10.5" font-weight="700" fill="#0969da">01 · TIME SERIES FORECASTING</text>
      <text x="344" y="76" class="sans" font-size="19" font-weight="700" fill="#1f2328">Port Cargo Throughput</text>
      <text x="344" y="102" class="sans" font-size="12.5" fill="#59636e">Modeled 58 months of NMPA maritime</text>
      <text x="344" y="120" class="sans" font-size="12.5" fill="#59636e">operations to project berth demand.</text>

      <text x="344" y="160" class="mono" font-size="15" font-weight="700" fill="#1a7f37">6.22M MT · 96.4% Fit</text>
      <text x="344" y="206" class="mono" font-size="11" fill="#818b98">Python · SARIMA · Statsmodels · Seaborn</text>

      <!-- Mini Visual -->
      <rect x="618" y="42" width="240" height="174" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <g stroke="#e5e7eb" stroke-dasharray="3 4">
        <line x1="632" y1="84" x2="844" y2="84"/>
        <line x1="632" y1="122" x2="844" y2="122"/>
        <line x1="632" y1="160" x2="844" y2="160"/>
      </g>
      <line x1="744" y1="54" x2="744" y2="188" stroke="#d0d7de" stroke-dasharray="3 3"/>
      <path d="M 636 164 L 664 148 L 690 154 L 716 132 L 744 136"
            fill="none" stroke="#0969da" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 744 136 L 776 122 L 806 110 L 836 96 L 836 184 L 744 184 Z" fill="rgba(26,127,55,0.12)"/>
      <path d="M 744 136 L 776 122 L 806 110 L 836 96"
            fill="none" stroke="#1a7f37" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="836" cy="96" r="4" fill="#1a7f37"/>
      <text x="636" y="202" class="mono" font-size="10" fill="#818b98">HISTORY</text>
      <text x="840" y="202" text-anchor="end" class="mono" font-size="10" fill="#1a7f37">2026 TARGET</text>
    </g>

    <!-- SLIDE 2: Retail Revenue BI -->
    <g class="slide2">
      <text x="344" y="50" class="mono" font-size="10.5" font-weight="700" fill="#9a6700">02 · BUSINESS INTELLIGENCE</text>
      <text x="344" y="76" class="sans" font-size="19" font-weight="700" fill="#1f2328">Retail Revenue Intelligence</text>
      <text x="344" y="102" class="sans" font-size="12.5" fill="#59636e">Transformed 10,000+ raw transactions into</text>
      <text x="344" y="120" class="sans" font-size="12.5" fill="#59636e">RFM cohort segmentation and Power BI KPIs.</text>

      <text x="344" y="160" class="mono" font-size="15" font-weight="700" fill="#9a6700">+24.8% RFM · $1.4M CLV</text>
      <text x="344" y="206" class="mono" font-size="11" fill="#818b98">SQL · Python · Power BI · Dynamic DAX</text>

      <rect x="618" y="42" width="240" height="174" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <line x1="636" y1="176" x2="840" y2="176" stroke="#d0d7de"/>
      <rect x="646" y="138" width="28" height="38" rx="4" fill="#0969da"/>
      <rect x="688" y="118" width="28" height="58" rx="4" fill="#8250df"/>
      <rect x="730" y="98" width="28" height="78" rx="4" fill="#9a6700"/>
      <rect x="772" y="74" width="28" height="102" rx="4" fill="#1a7f37"/>
      <text x="636" y="202" class="mono" font-size="10" fill="#818b98">COHORT Q1–Q4</text>
      <text x="840" y="202" text-anchor="end" class="mono" font-size="10" fill="#9a6700">10,000+ ROWS</text>
    </g>

    <!-- SLIDE 3: WellNest AI -->
    <g class="slide3">
      <text x="344" y="50" class="mono" font-size="10.5" font-weight="700" fill="#bf3989">03 · BEHAVIORAL TELEMETRY</text>
      <text x="344" y="76" class="sans" font-size="19" font-weight="700" fill="#1f2328">WellNest AI</text>
      <text x="344" y="102" class="sans" font-size="12.5" fill="#59636e">Mental wellness telemetry tracking mood</text>
      <text x="344" y="120" class="sans" font-size="12.5" fill="#59636e">shifts with automated PDF/CSV reporting.</text>

      <text x="344" y="160" class="mono" font-size="15" font-weight="700" fill="#bf3989">94.2% NLP · +18.4% Shift</text>
      <text x="344" y="206" class="mono" font-size="11" fill="#818b98">React · FastAPI · MongoDB · NVIDIA AI</text>

      <rect x="618" y="42" width="240" height="174" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <path d="M 636 142 C 668 164, 694 102, 728 124 C 760 144, 786 86, 832 102"
            fill="none" stroke="url(#moodGrad)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="636" cy="142" r="4" fill="#8250df"/>
      <circle cx="728" cy="124" r="4" fill="#bf3989"/>
      <circle cx="832" cy="102" r="4.5" fill="#bf3989"/>
      <rect x="636" y="58" width="88" height="22" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <text x="680" y="72.5" text-anchor="middle" class="mono" font-size="9.5" fill="#bf3989">REPORT.PDF ✓</text>
      <text x="636" y="202" class="mono" font-size="10" fill="#818b98">SENTIMENT STREAM</text>
      <text x="840" y="202" text-anchor="end" class="mono" font-size="10" fill="#bf3989">&lt; 42ms</text>
    </g>

    <!-- SLIDE 4: NutriGPT -->
    <g class="slide4">
      <text x="344" y="50" class="mono" font-size="10.5" font-weight="700" fill="#0598a2">04 · RETRIEVAL ENGINE</text>
      <text x="344" y="76" class="sans" font-size="19" font-weight="700" fill="#1f2328">NutriGPT</text>
      <text x="344" y="102" class="sans" font-size="12.5" fill="#59636e">Context-grounded RAG search over verified</text>
      <text x="344" y="120" class="sans" font-size="12.5" fill="#59636e">nutrition records for zero-hallucination Q&amp;A.</text>

      <text x="344" y="160" class="mono" font-size="15" font-weight="700" fill="#0598a2">8,000+ Items · 0.14s Query</text>
      <text x="344" y="206" class="mono" font-size="11" fill="#818b98">Python · Llama 3 · ChromaDB · LangChain</text>

      <rect x="618" y="42" width="240" height="174" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="634" y="58" width="208" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <text x="644" y="75" class="mono" font-size="10" fill="#1f2328">query: iron-rich foods</text>
      <rect x="634" y="96" width="208" height="18" rx="4" fill="rgba(26,127,55,0.12)" stroke="#1a7f37" stroke-width="0.8"/>
      <text x="644" y="108.5" class="mono" font-size="9.5" fill="#1a7f37">match 0.94 · USDA verified</text>
      <g stroke="#0598a2" stroke-width="3" stroke-linecap="round">
        <line x1="638" y1="134" x2="824" y2="134"/>
        <line x1="638" y1="150" x2="790" y2="150" opacity="0.75"/>
        <line x1="638" y1="166" x2="752" y2="166" opacity="0.55"/>
      </g>
      <text x="636" y="202" class="mono" font-size="10" fill="#818b98">CHROMADB</text>
      <text x="840" y="202" text-anchor="end" class="mono" font-size="10" fill="#0598a2">0% HALLUCINATION</text>
    </g>
  </g>
  <rect x="324.5" y="0.5" width="555" height="239" rx="12" fill="none" stroke="#d0d7de"/>
</svg>
