<svg xmlns="http://www.w3.org/2000/svg"
     width="840" height="268" viewBox="0 0 840 268"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Pradeep Mathias — Business &amp; Data Analyst Workspace</title>
  <desc id="hero-desc">
    Figma workspace hero banner from pradeepmathias.vercel.app featuring the animated
    PRADEEP MATHIAS letter tiles inside a Figma selection bounding box with live cursor
    and smooth Framer Motion stagger easing.
  </desc>

  <defs>
    <pattern id="heroDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.85" fill="#262c36" opacity="0.65"/>
    </pattern>
    <linearGradient id="heroCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151923" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0f131c" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="heroBorderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#343d4f"/>
      <stop offset="100%" stop-color="#1c222e"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Noto Sans, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    /* Smooth Framer Motion spring-like stagger on portfolio letter tiles */
    .tile { animation: springFloat 4.8s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .t1 { animation-delay: 0.00s; }
    .t2 { animation-delay: 0.14s; }
    .t3 { animation-delay: 0.28s; }
    .t4 { animation-delay: 0.42s; }
    .t5 { animation-delay: 0.56s; }
    .t6 { animation-delay: 0.70s; }
    .t7 { animation-delay: 0.84s; }

    @keyframes springFloat {
      0%, 100% { transform: translateY(0px); }
      45% { transform: translateY(-4.5px); }
    }

    /* Smooth multiplayer cursor inspecting the selection box handles (never crosses text) */
    .figCursor {
      animation: glideFigCursor 9.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes glideFigCursor {
      0%, 14%   { transform: translate(672px, 162px); }
      38%, 54%  { transform: translate(674px, 74px); }
      74%, 86%  { transform: translate(626px, 166px); }
      100%      { transform: translate(672px, 162px); }
    }

    /* Subtle pulse on live availability dot */
    .statusPulse {
      animation: statusBeacon 2.6s ease-in-out infinite;
    }
    @keyframes statusBeacon {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50%      { transform: scale(1.45); opacity: 0.35; }
    }

    /* Shimmer sweep along Figma selection border */
    .frameSweep {
      stroke-dasharray: 90 1180;
      animation: frameLoop 6.5s linear infinite;
    }
    @keyframes frameLoop {
      from { stroke-dashoffset: 1270; }
      to   { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile, .figCursor, .statusPulse, .frameSweep { animation: none; }
      .figCursor { transform: translate(654px, 152px); }
      .frameSweep { opacity: 0; }
    }
  </style>

  <!-- Architectural Figma Canvas Surface (blends naturally into GitHub) -->
  <rect x="0.5" y="0.5" width="839" height="267" rx="16"
        fill="url(#heroCardGrad)" stroke="url(#heroBorderGrad)" stroke-width="1"/>
  <rect x="1" y="1" width="838" height="266" rx="15.5" fill="url(#heroDots)"/>

  <!-- Top Workspace Chrome Bar -->
  <g transform="translate(24, 24)">
    <circle cx="5" cy="0" r="3.5" fill="#10b981"/>
    <circle cx="5" cy="0" r="3.5" fill="#10b981" class="statusPulse" style="transform-box:fill-box;transform-origin:center;"/>
    <text x="17" y="4" class="mono" font-size="11" fill="#8b95a5">
      pradeep_workspace.fig <tspan fill="#647082">/ Hero</tspan>
    </text>

    <g transform="translate(792, 0)" text-anchor="end">
      <text x="0" y="4" class="mono" font-size="11" fill="#647082">
        Mangaluru, IN  ·  <tspan fill="#8b95a5">Zoom 100% · 60fps</tspan>
      </text>
    </g>
  </g>

  <!-- Subtle Hairline Divider under Chrome Bar -->
  <line x1="20" y1="40" x2="820" y2="40" stroke="#1c2230" stroke-width="1"/>

  <!-- Centered Portfolio Signature Banner: Figma Selection Box around [P][R][A][D][E][E][P] MATHIAS -->
  <g>
    <!-- Bounding Box -->
    <rect x="170" y="54" width="500" height="134"
          fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1.35"/>
    <!-- Animated shimmer highlight traveling along selection border -->
    <rect x="170" y="54" width="500" height="134"
          fill="none" stroke="#f0f4f8" stroke-width="1.35" opacity="0.42" class="frameSweep"/>

    <!-- 8 Crisp Figma Resize Handles -->
    <g fill="#0d1117" stroke="#3b82f6" stroke-width="1.4">
      <rect x="166.5" y="50.5" width="7" height="7" rx="1"/>
      <rect x="416.5" y="50.5" width="7" height="7" rx="1"/>
      <rect x="666.5" y="50.5" width="7" height="7" rx="1"/>
      <rect x="166.5" y="117.5" width="7" height="7" rx="1"/>
      <rect x="666.5" y="117.5" width="7" height="7" rx="1"/>
      <rect x="166.5" y="184.5" width="7" height="7" rx="1"/>
      <rect x="416.5" y="184.5" width="7" height="7" rx="1"/>
      <rect x="666.5" y="184.5" width="7" height="7" rx="1"/>
    </g>

    <!-- Dimension Badge -->
    <rect x="382" y="179" width="76" height="18" rx="4" fill="#3b82f6"/>
    <text x="420" y="191.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ffffff">
      500 × 134
    </text>

    <!-- Portfolio Signature Kinetic Letter Tiles: P R A D E E P -->
    <g text-anchor="middle" class="sans" font-weight="800" font-size="27">
      <g transform="translate(270 96)"><g class="tile t1"><g transform="rotate(-5)">
        <rect x="-21" y="-23" width="42" height="46" rx="8" fill="#00E5FF"/>
        <text y="9.5" fill="#090d16">P</text>
      </g></g></g>

      <g transform="translate(320 96)"><g class="tile t2"><g transform="rotate(4)">
        <rect x="-21" y="-23" width="42" height="46" rx="8" fill="#FF2A4D"/>
        <text y="9.5" fill="#ffffff">R</text>
      </g></g></g>

      <g transform="translate(370 96)"><g class="tile t3"><g transform="rotate(-4)">
        <rect x="-21" y="-23" width="42" height="46" rx="8" fill="#FFB703"/>
        <text y="9.5" fill="#090d16" font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</text>
      </g></g></g>

      <g transform="translate(420 96)"><g class="tile t4"><g transform="rotate(3)">
        <rect x="-21" y="-23" width="42" height="46" rx="8" fill="#10B981"/>
        <text y="9.5" fill="#ffffff">D</text>
      </g></g></g>

      <g transform="translate(470 96)"><g class="tile t5"><g transform="rotate(-4)">
        <rect x="-21" y="-23" width="42" height="46" rx="8" fill="#7B61FF"/>
        <text y="9.5" fill="#ffffff">E</text>
      </g></g></g>

      <g transform="translate(520 96)"><g class="tile t6"><g transform="rotate(4)">
        <rect x="-21" y="-23" width="42" height="46" rx="8" fill="#f4f4f5" stroke="#334155" stroke-width="1"/>
        <text y="9.5" fill="#090d16">E</text>
      </g></g></g>

      <g transform="translate(570 96)"><g class="tile t7"><g transform="rotate(-5)">
        <rect x="-21" y="-23" width="42" height="46" rx="8" fill="#FF007A"/>
        <text y="9.5" fill="#ffffff">P</text>
      </g></g></g>
    </g>

    <!-- MATHIAS Wordmark -->
    <text x="420" y="160" text-anchor="middle" class="sans" font-size="28" font-weight="800" letter-spacing="6" fill="#f0f4f8">
      MATHIAS
    </text>
  </g>

  <!-- Role & Core Info Strip Beneath Frame -->
  <text x="420" y="218" text-anchor="middle" class="mono" font-size="12.5" fill="#cbd5e1">
    Business Analyst  <tspan fill="#647082">|</tspan>  SQL · Power BI · Python · Excel
  </text>

  <!-- Minimal Credential Pills -->
  <g transform="translate(154, 232)" class="mono" font-size="10.5">
    <rect x="0" y="0" width="166" height="22" rx="6" fill="#151a24" stroke="#262e3d"/>
    <text x="83" y="14.5" text-anchor="middle" fill="#8b95a5">MSc Data Science · 8.5</text>

    <rect x="176" y="0" width="174" height="22" rx="6" fill="#151a24" stroke="#262e3d"/>
    <text x="263" y="14.5" text-anchor="middle" fill="#8b95a5">NMPA &amp; Euron Internships</text>

    <rect x="360" y="0" width="172" height="22" rx="6" fill="#151a24" stroke="#262e3d"/>
    <circle cx="374" cy="11" r="3" fill="#10b981"/>
    <text x="451" y="14.5" text-anchor="middle" fill="#cbd5e1">Open to BA / DA Roles</text>
  </g>

  <!-- Live Figma Multiplayer Cursor -->
  <g class="figCursor">
    <path d="M 0 0 L 0 14 L 4 10.5 L 7.5 16 L 9.5 15 L 6 9.5 L 11 9.5 Z"
          fill="#3b82f6" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="11" y="12" width="52" height="17" rx="8.5" fill="#3b82f6"/>
    <text x="37" y="23.5" text-anchor="middle" class="sans" font-size="9.5" font-weight="700" fill="#ffffff">Pradeep</text>
  </g>
</svg>