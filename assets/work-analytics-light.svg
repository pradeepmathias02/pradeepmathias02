<svg xmlns="http://www.w3.org/2000/svg"
     width="840" height="316" viewBox="0 0 840 316"
     role="img" aria-labelledby="wa-title wa-desc">
  <title id="wa-title">Data &amp; Business Analytics Work — NMPA Forecasting and Retail BI</title>
  <desc id="wa-desc">
    Two spacious cards showcasing NMPA 58-month SARIMA cargo forecasting to 6.22M tonnes,
    and Retail Customer Behavior ETL pipeline from raw records to SQL schema and Power BI KPIs.
  </desc>

  <defs>
    <linearGradient id="waCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfd"/>
      <stop offset="100%" stop-color="#f3f6f9"/>
    </linearGradient>
    <linearGradient id="waBorderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="nmpaCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="sweepLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669" stop-opacity="0"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="stage1Clip">
      <rect x="24" y="128" width="362" height="140" rx="10"/>
    </clipPath>
    <clipPath id="stage2Clip">
      <rect x="454" y="128" width="362" height="140" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Noto Sans, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    /* ---- Card 01: NMPA SARIMA Continuous Loop (7s, cubic-bezier spring feel) ---- */
    .nmpaHist {
      stroke-dasharray: 220;
      animation: drawHist 7s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .nmpaForecast {
      stroke-dasharray: 180;
      animation: drawForecast 7s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .nmpaArea {
      animation: showArea 7s ease-in-out infinite;
    }
    .nmpaPeak {
      animation: popPeak 7s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .nmpaScan {
      animation: scanHorizon 7s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    @keyframes drawHist {
      0%, 4%    { stroke-dashoffset: 220; }
      30%, 88%  { stroke-dashoffset: 0; }
      96%, 100% { stroke-dashoffset: 220; }
    }
    @keyframes drawForecast {
      0%, 26%   { stroke-dashoffset: 180; }
      56%, 88%  { stroke-dashoffset: 0; }
      96%, 100% { stroke-dashoffset: 180; }
    }
    @keyframes showArea {
      0%, 30%   { opacity: 0; }
      56%, 86%  { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    @keyframes popPeak {
      0%, 50%   { opacity: 0; transform: translateY(5px); }
      62%, 86%  { opacity: 1; transform: translateY(0px); }
      95%, 100% { opacity: 0; transform: translateY(3px); }
    }
    @keyframes scanHorizon {
      0%, 4%    { transform: translateX(0px); opacity: 0; }
      8%        { opacity: 1; }
      56%       { transform: translateX(305px); opacity: 1; }
      66%, 100% { transform: translateX(305px); opacity: 0; }
    }

    /* ---- Card 02: Retail Customer ETL -> SQL -> Power BI Loop (7s, offset +0.35s) ---- */
    .rawRow1 { animation: cleanRow 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.25s; }
    .rawRow2 { animation: cleanRow 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.45s; }
    .rawRow3 { animation: cleanRow 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.65s; }
    @keyframes cleanRow {
      0%, 6%    { opacity: 0.72; transform: translateX(0px); }
      26%, 84%  { opacity: 1.00; transform: translateX(6px); }
      94%, 100% { opacity: 0.72; transform: translateX(0px); }
    }

    .etlBeam {
      animation: movePacket 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.35s;
    }
    @keyframes movePacket {
      0%, 18%   { transform: translateX(0px); opacity: 0; }
      24%       { opacity: 1; }
      42%       { transform: translateX(46px); opacity: 1; }
      48%, 100% { transform: translateX(46px); opacity: 0; }
    }

    .pbiBar1 { animation: scaleB1 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.35s; }
    .pbiBar2 { animation: scaleB2 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.35s; }
    .pbiBar3 { animation: scaleB3 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.35s; }
    .pbiBar4 { animation: scaleB4 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.35s; }

    @keyframes scaleB1 {
      0%, 34%   { transform: scaleY(0.28); }
      50%, 86%  { transform: scaleY(1); }
      95%, 100% { transform: scaleY(0.28); }
    }
    @keyframes scaleB2 {
      0%, 38%   { transform: scaleY(0.28); }
      54%, 86%  { transform: scaleY(1); }
      95%, 100% { transform: scaleY(0.28); }
    }
    @keyframes scaleB3 {
      0%, 42%   { transform: scaleY(0.28); }
      58%, 86%  { transform: scaleY(1); }
      95%, 100% { transform: scaleY(0.28); }
    }
    @keyframes scaleB4 {
      0%, 46%   { transform: scaleY(0.28); }
      62%, 86%  { transform: scaleY(1); }
      95%, 100% { transform: scaleY(0.28); }
    }

    .kpiTrend {
      stroke-dasharray: 160;
      animation: drawKpi 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.35s;
    }
    @keyframes drawKpi {
      0%, 50%   { stroke-dashoffset: 160; }
      70%, 86%  { stroke-dashoffset: 0; }
      95%, 100% { stroke-dashoffset: 160; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nmpaHist, .nmpaForecast, .nmpaArea, .nmpaPeak, .nmpaScan,
      .rawRow1, .rawRow2, .rawRow3, .etlBeam,
      .pbiBar1, .pbiBar2, .pbiBar3, .pbiBar4, .kpiTrend { animation: none; }
      .nmpaHist, .nmpaForecast, .kpiTrend { stroke-dashoffset: 0; }
      .nmpaArea, .nmpaPeak { opacity: 1; transform: none; }
      .nmpaScan, .etlBeam { opacity: 0; }
    }
  </style>

  <!-- ==================== CARD 01: NMPA PORT FORECASTING ==================== -->
  <g>
    <rect x="0.5" y="0.5" width="409" height="315" rx="16"
          fill="url(#waCardGrad)" stroke="url(#waBorderGrad)" stroke-width="1"/>

    <text x="24" y="30" class="mono" font-size="10.5" font-weight="600" fill="#059669" letter-spacing="1.2">
      01  ·  EXPERIENCE  ·  NMPA INTERN
    </text>
    <rect x="308" y="16" width="78" height="20" rx="5" fill="rgba(5,150,105,0.10)"/>
    <text x="347" y="29.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#059669">
      JAN–MAR 26
    </text>

    <text x="24" y="58" class="sans" font-size="18" font-weight="700" fill="#0f172a">
      Port Cargo SARIMA Forecast
    </text>
    <text x="24" y="81" class="sans" font-size="12.5" fill="#475569">
      Analysed 58 months of vessel traffic &amp; berth KPIs;
    </text>
    <text x="24" y="99" class="sans" font-size="12.5" fill="#475569">
      modeled 2026 cargo throughput growth to 6.22M tonnes.
    </text>

    <!-- Motion Stage 01 -->
    <rect x="24" y="128" width="362" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <g clip-path="url(#stage1Clip)">
      <!-- Subtle chart gridlines -->
      <g stroke="#edf1f5" stroke-dasharray="3 4" stroke-width="1">
        <line x1="40" y1="162" x2="372" y2="162"/>
        <line x1="40" y1="194" x2="372" y2="194"/>
        <line x1="40" y1="226" x2="372" y2="226"/>
      </g>

      <!-- Axis labels -->
      <text x="38" y="146" class="mono" font-size="9.5" fill="#64748b">58 MONTHS TELEMETRY</text>
      <text x="234" y="146" class="mono" font-size="9.5" fill="#059669">FORECAST</text>

      <!-- Forecast Divider -->
      <line x1="226" y1="140" x2="226" y2="246" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/>

      <!-- Scanning light band across timeline -->
      <rect x="34" y="132" width="36" height="132" fill="url(#sweepLight)" class="nmpaScan"/>

      <!-- Historical SARIMA trajectory -->
      <path class="nmpaHist"
            d="M 42 224 L 74 210 L 106 216 L 138 195 L 168 202 L 198 184 L 226 188"
            fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Confidence / Projection Area -->
      <path class="nmpaArea"
            d="M 226 188 L 260 177 L 296 168 L 330 160 L 362 153 L 362 240 L 226 240 Z"
            fill="url(#nmpaCone)"/>

      <!-- 2026 Forecast trajectory -->
      <path class="nmpaForecast"
            d="M 226 188 L 260 177 L 296 168 L 330 160 L 362 153"
            fill="none" stroke="#059669" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Target 6.22M Tonnes Peak Callout -->
      <g class="nmpaPeak">
        <circle cx="362" cy="153" r="8" fill="#059669" opacity="0.24"/>
        <circle cx="362" cy="153" r="3.8" fill="#059669"/>
        <rect x="298" y="134" width="76" height="17" rx="4" fill="#ffffff" stroke="#059669" stroke-width="0.9"/>
        <text x="336" y="146" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#059669">
          6.22M MT
        </text>
      </g>

      <!-- Baseline Footer inside Stage -->
      <line x1="40" y1="246" x2="372" y2="246" stroke="#e2e8f0"/>
      <text x="40" y="259" class="mono" font-size="9.5" fill="#64748b">HISTORY (EDA &amp; SEASONALITY)</text>
      <text x="372" y="259" text-anchor="end" class="mono" font-size="9.5" fill="#059669">CAPACITY PLAN ✓</text>
    </g>

    <text x="24" y="294" class="mono" font-size="11" fill="#64748b">
      Python  ·  SARIMA  ·  Matplotlib  ·  Seaborn
    </text>
  </g>

  <!-- ==================== CARD 02: RETAIL CUSTOMER BI ==================== -->
  <g>
    <rect x="430.5" y="0.5" width="409" height="315" rx="16"
          fill="url(#waCardGrad)" stroke="url(#waBorderGrad)" stroke-width="1"/>

    <text x="454" y="30" class="mono" font-size="10.5" font-weight="600" fill="#2563eb" letter-spacing="1.2">
      02  ·  PROJECT  ·  BUSINESS BI
    </text>
    <rect x="742" y="16" width="74" height="20" rx="5" fill="rgba(37,99,235,0.08)"/>
    <text x="779" y="29.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#2563eb">
      POWER BI
    </text>

    <text x="454" y="58" class="sans" font-size="18" font-weight="700" fill="#0f172a">
      Retail Customer &amp; Trends BI
    </text>
    <text x="454" y="81" class="sans" font-size="12.5" fill="#475569">
      Cleaned customer data &amp; engineered features in Python;
    </text>
    <text x="454" y="99" class="sans" font-size="12.5" fill="#475569">
      built SQL schema &amp; interactive Power BI KPI dashboard.
    </text>

    <!-- Motion Stage 02: Left Python/SQL Cleaning -> Right Power BI Revenue & Cohorts -->
    <rect x="454" y="128" width="362" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <g clip-path="url(#stage2Clip)">
      <!-- Left Zone: Raw Data -> Clean SQL Schema -->
      <text x="468" y="146" class="mono" font-size="9.5" fill="#64748b">PYTHON + SQL ETL</text>

      <g class="rawRow1">
        <rect x="468" y="156" width="114" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="478" cy="166" r="2.5" fill="#2563eb"/>
        <text x="486" y="169.5" class="mono" font-size="9" fill="#334155">clean_features</text>
      </g>
      <g class="rawRow2">
        <rect x="468" y="182" width="114" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="478" cy="192" r="2.5" fill="#2563eb"/>
        <text x="486" y="195.5" class="mono" font-size="9" fill="#334155">sql_schema.ddl</text>
      </g>
      <g class="rawRow3">
        <rect x="468" y="208" width="114" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="478" cy="218" r="2.5" fill="#d97706"/>
        <text x="486" y="221.5" class="mono" font-size="9" fill="#334155">eda_trends.sql</text>
      </g>

      <!-- Pipeline Wire + Flowing Packet -->
      <line x1="586" y1="192" x2="636" y2="192" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="588" cy="192" r="4" fill="#2563eb" class="etlBeam"/>

      <!-- Right Zone: Power BI Monochrome Cobalt KPI Chart (Zero Rainbow Colors) -->
      <rect x="636" y="140" width="166" height="114" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="648" y="156" class="mono" font-size="9.5" fill="#334155">CUSTOMER SEGMENTS</text>
      <rect x="768" y="146" width="26" height="13" rx="3" fill="rgba(37,99,235,0.08)"/>
      <text x="781" y="155.5" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#d97706">KPI</text>

      <!-- Chart Baseline -->
      <line x1="650" y1="238" x2="788" y2="238" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Bars anchored cleanly at baseline (y=238) so scaleY grows upward identically everywhere -->
      <g transform="translate(658, 238)">
        <rect x="0" y="-26" width="22" height="26" rx="3" fill="#bfdbfe" class="pbiBar1"/>
      </g>
      <g transform="translate(690, 238)">
        <rect x="0" y="-42" width="22" height="42" rx="3" fill="#93c5fd" class="pbiBar2"/>
      </g>
      <g transform="translate(722, 238)">
        <rect x="0" y="-56" width="22" height="56" rx="3" fill="#3b82f6" class="pbiBar3"/>
      </g>
      <g transform="translate(754, 238)">
        <rect x="0" y="-72" width="22" height="72" rx="3" fill="#1d4ed8" class="pbiBar4"/>
      </g>

      <!-- Overlaid KPI Trend Curve -->
      <path class="kpiTrend"
            d="M 669 208 L 701 191 L 733 177 L 765 162"
            fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="468" y="259" class="mono" font-size="9.5" fill="#64748b">CLEANED &amp; MODELED</text>
      <text x="802" y="259" text-anchor="end" class="mono" font-size="9.5" fill="#2563eb">KPI DASHBOARD</text>
    </g>

    <text x="454" y="294" class="mono" font-size="11" fill="#64748b">
      Python  ·  SQL Schema  ·  EDA  ·  Power BI
    </text>
  </g>
</svg>