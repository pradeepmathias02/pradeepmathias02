<svg xmlns="http://www.w3.org/2000/svg"
     width="840" height="316" viewBox="0 0 840 316"
     role="img" aria-labelledby="ai-title ai-desc">
  <title id="ai-title">AI Systems &amp; Behavioral Telemetry — WellNest AI and NutriGPT</title>
  <desc id="ai-desc">
    Two spacious cards showcasing WellNest AI emotional trend tracking and automated
    FastAPI PDF/CSV report export, and NutriGPT HuggingFace + ChromaDB RAG streaming with Groq Llama-3.
  </desc>

  <defs>
    <linearGradient id="aiCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfd"/>
      <stop offset="100%" stop-color="#f3f6f9"/>
    </linearGradient>
    <linearGradient id="aiBorderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="wellCurveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <clipPath id="stage3Clip">
      <rect x="24" y="128" width="362" height="140" rx="10"/>
    </clipPath>
    <clipPath id="stage4Clip">
      <rect x="454" y="128" width="362" height="140" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Noto Sans, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    /* ---- Card 03: WellNest AI Sentiment -> PDF/CSV Report Loop (7s, offset +0.6s) ---- */
    .wellCurve {
      stroke-dasharray: 240;
      animation: traceWave 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.6s;
    }
    @keyframes traceWave {
      0%, 6%    { stroke-dashoffset: 240; }
      38%, 88%  { stroke-dashoffset: 0; }
      96%, 100% { stroke-dashoffset: 240; }
    }

    .wellNode1 { animation: popNode1 7s ease-out infinite 0.6s; }
    .wellNode2 { animation: popNode2 7s ease-out infinite 0.6s; }
    .wellNode3 { animation: popNode3 7s ease-out infinite 0.6s; }
    @keyframes popNode1 {
      0%, 14%   { opacity: 0.15; transform: scale(0.75); }
      22%, 88%  { opacity: 1; transform: scale(1); }
      95%, 100% { opacity: 0.15; }
    }
    @keyframes popNode2 {
      0%, 24%   { opacity: 0.15; transform: scale(0.75); }
      32%, 88%  { opacity: 1; transform: scale(1); }
      95%, 100% { opacity: 0.15; }
    }
    @keyframes popNode3 {
      0%, 34%   { opacity: 0.15; transform: scale(0.75); }
      42%, 88%  { opacity: 1; transform: scale(1); }
      95%, 100% { opacity: 0.15; }
    }

    .wellPacket {
      animation: sendReport 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.6s;
    }
    @keyframes sendReport {
      0%, 34%   { transform: translateX(0px); opacity: 0; }
      38%       { opacity: 1; }
      52%       { transform: translateX(34px); opacity: 1; }
      56%, 100% { transform: translateX(34px); opacity: 0; }
    }

    .reportCard {
      animation: slideReport 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.6s;
    }
    @keyframes slideReport {
      0%, 40%   { opacity: 0.68; transform: translateY(4px); }
      54%, 86%  { opacity: 1; transform: translateY(0px); }
      95%, 100% { opacity: 0.68; transform: translateY(4px); }
    }

    .repLine1 { stroke-dasharray: 80; animation: drawRep1 7s ease infinite 0.6s; }
    .repLine2 { stroke-dasharray: 80; animation: drawRep2 7s ease infinite 0.6s; }
    @keyframes drawRep1 {
      0%, 48%   { stroke-dashoffset: 80; }
      62%, 88%  { stroke-dashoffset: 0; }
      95%, 100% { stroke-dashoffset: 80; }
    }
    @keyframes drawRep2 {
      0%, 54%   { stroke-dashoffset: 80; }
      68%, 88%  { stroke-dashoffset: 0; }
      95%, 100% { stroke-dashoffset: 80; }
    }

    /* ---- Card 04: NutriGPT RAG Retrieval -> Llama-3 Stream Loop (7s, offset +0.9s) ---- */
    .chunkMatch {
      animation: lightChunk 7s ease-in-out infinite 0.9s;
    }
    @keyframes lightChunk {
      0%, 10%   { opacity: 0.55; }
      22%, 86%  { opacity: 1; }
      95%, 100% { opacity: 0.55; }
    }

    .ragPacket {
      animation: sendVector 7s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.9s;
    }
    @keyframes sendVector {
      0%, 24%   { transform: translateX(0px); opacity: 0; }
      28%       { opacity: 1; }
      44%       { transform: translateX(42px); opacity: 1; }
      48%, 100% { transform: translateX(42px); opacity: 0; }
    }

    .stream1 { stroke-dasharray: 120; animation: sLine1 7s ease infinite 0.9s; }
    .stream2 { stroke-dasharray: 120; animation: sLine2 7s ease infinite 0.9s; }
    .stream3 { stroke-dasharray: 120; animation: sLine3 7s ease infinite 0.9s; }
    @keyframes sLine1 {
      0%, 42%   { stroke-dashoffset: 120; opacity: 0; }
      44%       { opacity: 1; }
      58%, 88%  { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes sLine2 {
      0%, 48%   { stroke-dashoffset: 120; opacity: 0; }
      50%       { opacity: 1; }
      64%, 88%  { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes sLine3 {
      0%, 54%   { stroke-dashoffset: 120; opacity: 0; }
      56%       { opacity: 1; }
      70%, 88%  { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wellCurve, .wellNode1, .wellNode2, .wellNode3, .wellPacket, .reportCard, .repLine1, .repLine2,
      .chunkMatch, .ragPacket, .stream1, .stream2, .stream3 { animation: none; }
      .wellCurve, .repLine1, .repLine2, .stream1, .stream2, .stream3 { stroke-dashoffset: 0; opacity: 1; }
      .wellNode1, .wellNode2, .wellNode3, .reportCard, .chunkMatch { opacity: 1; transform: none; }
      .wellPacket, .ragPacket { opacity: 0; }
    }
  </style>

  <!-- ==================== CARD 03: WELLNEST AI ==================== -->
  <g>
    <rect x="0.5" y="0.5" width="409" height="315" rx="16"
          fill="url(#aiCardGrad)" stroke="url(#aiBorderGrad)" stroke-width="1"/>

    <text x="24" y="30" class="mono" font-size="10.5" font-weight="600" fill="#4f46e5" letter-spacing="1.2">
      03  ·  EXPERIENCE  ·  EURON INTERN
    </text>
    <rect x="308" y="16" width="78" height="20" rx="5" fill="rgba(79,70,229,0.08)"/>
    <text x="347" y="29.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#4f46e5">
      JAN–APR 26
    </text>

    <text x="24" y="58" class="sans" font-size="18" font-weight="700" fill="#0f172a">
      WellNest AI Wellness Platform
    </text>
    <text x="24" y="81" class="sans" font-size="12.5" fill="#475569">
      Mood tracking &amp; journaling app analyzing behavioral
    </text>
    <text x="24" y="99" class="sans" font-size="12.5" fill="#475569">
      trends with automated FastAPI PDF/CSV reporting.
    </text>

    <!-- Motion Stage 03: Behavioral Mood Trend -> Automated Report Export -->
    <rect x="24" y="128" width="362" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <g clip-path="url(#stage3Clip)">
      <text x="38" y="146" class="mono" font-size="9.5" fill="#64748b">MOOD &amp; JOURNAL TRENDS</text>

      <!-- Subtle Guide Lines -->
      <line x1="38" y1="176" x2="220" y2="176" stroke="#edf1f5" stroke-dasharray="3 4"/>
      <line x1="38" y1="208" x2="220" y2="208" stroke="#edf1f5" stroke-dasharray="3 4"/>
      <line x1="38" y1="238" x2="220" y2="238" stroke="#e2e8f0"/>

      <!-- Longitudinal Mood Wave (faint guide underneath so card is never blank) -->
      <path d="M 42 224 C 66 232, 82 184, 108 198 C 134 212, 152 168, 178 182 C 194 190, 206 168, 222 172"
            fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.20" stroke-linecap="round"/>
      <path class="wellCurve"
            d="M 42 224 C 66 232, 82 184, 108 198 C 134 212, 152 168, 178 182 C 194 190, 206 168, 222 172"
            fill="none" stroke="url(#wellCurveGrad)" stroke-width="2.6" stroke-linecap="round"/>

      <!-- Mood Checkpoints -->
      <g transform="translate(108, 198)"><circle r="3.5" fill="#4f46e5" class="wellNode1"/></g>
      <g transform="translate(178, 182)"><circle r="3.5" fill="#4f46e5" class="wellNode2"/></g>
      <g transform="translate(222, 172)">
        <circle r="7" fill="#db2777" opacity="0.22" class="wellNode3"/>
        <circle r="3.8" fill="#db2777" class="wellNode3"/>
      </g>

      <!-- Connector Wire from Analytics Engine to FastAPI Export -->
      <line x1="228" y1="194" x2="268" y2="194" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="3 3"/>
      <circle cx="230" cy="194" r="3.8" fill="#4f46e5" class="wellPacket"/>

      <!-- Automated Report Card -->
      <g class="reportCard">
        <rect x="268" y="144" width="104" height="100" rx="8" fill="#f8fafc" stroke="#4f46e5" stroke-opacity="0.55"/>
        <rect x="278" y="154" width="52" height="15" rx="3.5" fill="rgba(79,70,229,0.08)"/>
        <text x="304" y="164.5" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#4f46e5">PDF / CSV</text>

        <line class="repLine1" x1="280" y1="184" x2="358" y2="184" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
        <line class="repLine2" x1="280" y1="198" x2="342" y2="198" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>

        <rect x="278" y="216" width="84" height="18" rx="4" fill="rgba(5,150,105,0.10)"/>
        <text x="320" y="228.5" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#059669">REPORT READY ✓</text>
      </g>

      <text x="38" y="259" class="mono" font-size="9.5" fill="#64748b">NVIDIA AI SENTIMENT</text>
      <text x="372" y="259" text-anchor="end" class="mono" font-size="9.5" fill="#4f46e5">FASTAPI EXPORT</text>
    </g>

    <text x="24" y="294" class="mono" font-size="11" fill="#64748b">
      React  ·  FastAPI  ·  MongoDB  ·  NVIDIA AI
    </text>
  </g>

  <!-- ==================== CARD 04: NUTRIGPT RAG ENGINE ==================== -->
  <g>
    <rect x="430.5" y="0.5" width="409" height="315" rx="16"
          fill="url(#aiCardGrad)" stroke="url(#aiBorderGrad)" stroke-width="1"/>

    <text x="454" y="30" class="mono" font-size="10.5" font-weight="600" fill="#059669" letter-spacing="1.2">
      04  ·  PROJECT  ·  RAG PIPELINE
    </text>
    <rect x="738" y="16" width="78" height="20" rx="5" fill="rgba(5,150,105,0.09)"/>
    <text x="777" y="29.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#059669">
      CHROMADB
    </text>

    <text x="454" y="58" class="sans" font-size="18" font-weight="700" fill="#0f172a">
      NutriGPT Nutrition Assistant
    </text>
    <text x="454" y="81" class="sans" font-size="12.5" fill="#475569">
      End-to-end RAG with HuggingFace embeddings &amp; ChromaDB;
    </text>
    <text x="454" y="99" class="sans" font-size="12.5" fill="#475569">
      streams context-grounded Groq Llama-3 replies in Streamlit.
    </text>

    <!-- Motion Stage 04: Query -> ChromaDB Top-K Retrieval -> Groq Llama-3 Stream -->
    <rect x="454" y="128" width="362" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <g clip-path="url(#stage4Clip)">
      <!-- Streamlit Chat Prompt Input -->
      <rect x="468" y="140" width="334" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="480" cy="152" r="3" fill="#059669"/>
      <text x="490" y="155.5" class="mono" font-size="10" fill="#334155">Ask anything about nutrition...</text>

      <!-- Vector DB Chunks (k=4 Retriever) -->
      <rect x="468" y="174" width="124" height="19" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <line x1="478" y1="183.5" x2="554" y2="183.5" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

      <!-- Highlighted Top-K Match -->
      <g class="chunkMatch">
        <rect x="468" y="198" width="124" height="21" rx="4" fill="rgba(5,150,105,0.09)" stroke="#059669" stroke-width="1"/>
        <text x="476" y="212" class="mono" font-size="9" font-weight="700" fill="#059669">top-k match · doc</text>
      </g>

      <rect x="468" y="224" width="124" height="19" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <line x1="478" y1="233.5" x2="540" y2="233.5" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

      <!-- Vector Connector Wire & Pulse Packet -->
      <line x1="596" y1="208" x2="646" y2="208" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="3 3"/>
      <circle cx="598" cy="208" r="4" fill="#d97706" class="ragPacket"/>

      <!-- Groq Llama-3 Streaming Output Card -->
      <rect x="646" y="174" width="156" height="69" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="658" y="189" class="mono" font-size="8.5" font-weight="700" fill="#059669">LLAMA-3 · GROUNDED</text>

      <line class="stream1" x1="658" y1="203" x2="788" y2="203" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
      <line class="stream2" x1="658" y1="216" x2="772" y2="216" stroke="#059669" stroke-width="2.6" stroke-linecap="round" opacity="0.72"/>
      <line class="stream3" x1="658" y1="229" x2="744" y2="229" stroke="#059669" stroke-width="2.6" stroke-linecap="round" opacity="0.48"/>

      <text x="468" y="259" class="mono" font-size="9.5" fill="#64748b">MINILM-L6-V2 EMBEDDINGS</text>
      <text x="802" y="259" text-anchor="end" class="mono" font-size="9.5" fill="#059669">STREAM RESPONSE</text>
    </g>

    <text x="454" y="294" class="mono" font-size="11" fill="#64748b">
      LangChain  ·  HuggingFace  ·  Groq Llama-3  ·  Streamlit
    </text>
  </g>
</svg>