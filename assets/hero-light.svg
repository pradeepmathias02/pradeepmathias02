<svg xmlns="http://www.w3.org/2000/svg"
     width="836" height="280" viewBox="0 0 836 280"
     role="img" aria-label="Pradeep Mathias — Business Analyst">

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Noto Sans, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .spark { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 3s cubic-bezier(.4,0,.2,1) forwards; }
    .fadeUp { opacity: 0; animation: fadeUp .6s ease forwards; }
    .d1 { animation-delay: .2s } .d2 { animation-delay: .4s } .d3 { animation-delay: .6s }
    .d4 { animation-delay: .8s } .d5 { animation-delay: 1s }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0) } }
    @keyframes pulse { 0%,100% { opacity: .6 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .spark { animation: none; stroke-dashoffset: 0 }
      .fadeUp { animation: none; opacity: 1 }
      .pulse { animation: none; opacity: .8 }
    }
  </style>

  <!-- Left half: Identity -->
  <g>
    <!-- Name -->
    <text x="32" y="52" class="sans" font-size="28" font-weight="700" fill="#1f2328" letter-spacing="-0.5">
      Pradeep Mathias
    </text>
    <text x="32" y="78" class="mono" font-size="13" fill="#656d76">
      Business Analyst  ·  Mangaluru, India
    </text>

    <!-- Separator -->
    <line x1="32" y1="96" x2="380" y2="96" stroke="#d0d7de" stroke-dasharray="3 3"/>

    <!-- Role badges — muted, tasteful -->
    <g class="fadeUp d1" transform="translate(0,-4)">
      <rect x="32" y="112" width="52" height="22" rx="4" fill="rgba(9,105,218,0.06)" stroke="#e5e7eb"/>
      <text x="58" y="127" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#0969da">SQL</text>

      <rect x="92" y="112" width="74" height="22" rx="4" fill="rgba(9,105,218,0.06)" stroke="#e5e7eb"/>
      <text x="129" y="127" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#0969da">Power BI</text>

      <rect x="174" y="112" width="66" height="22" rx="4" fill="rgba(9,105,218,0.06)" stroke="#e5e7eb"/>
      <text x="207" y="127" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#0969da">Python</text>

      <rect x="248" y="112" width="54" height="22" rx="4" fill="rgba(9,105,218,0.06)" stroke="#e5e7eb"/>
      <text x="275" y="127" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#0969da">Excel</text>
    </g>

    <!-- Education -->
    <g class="fadeUp d2">
      <text x="32" y="162" class="sans" font-size="13" font-weight="600" fill="#32383f">
        MSc Data Science
        <tspan fill="#656d76" font-weight="400"> · AIMIT · 8.5 CGPA</tspan>
      </text>
      <text x="32" y="182" class="sans" font-size="13" font-weight="600" fill="#32383f">
        BSc Mathematics
        <tspan fill="#656d76" font-weight="400"> · St. Aloysius College</tspan>
      </text>
    </g>

    <!-- Experience -->
    <g class="fadeUp d3">
      <text x="32" y="214" class="mono" font-size="10.5" fill="#afb8c1" letter-spacing="1.5">EXPERIENCE</text>
      <text x="32" y="234" class="sans" font-size="12.5" fill="#32383f">
        <tspan font-weight="600">NMPA</tspan>
        <tspan fill="#656d76"> Data Analyst Intern · Jan–Mar 2026</tspan>
      </text>
      <text x="32" y="252" class="sans" font-size="12.5" fill="#32383f">
        <tspan font-weight="600">Euron</tspan>
        <tspan fill="#656d76"> AI Developer Intern · Jan–Apr 2026</tspan>
      </text>
    </g>
  </g>

  <!-- Right half: SARIMA forecast mini-card -->
  <g transform="translate(440, 16)">
    <rect width="380" height="248" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>

    <!-- Card header -->
    <text x="24" y="32" class="mono" font-size="10" fill="#afb8c1" letter-spacing="1.5">NMPA · PORT CARGO FORECAST</text>
    <circle class="pulse" cx="348" cy="27" r="4" fill="#1a7f37"/>

    <!-- Key metrics row -->
    <g class="fadeUp d3">
      <text x="24" y="60" class="sans" font-size="22" font-weight="700" fill="#1f2328">58</text>
      <text x="52" y="60" class="sans" font-size="13" fill="#656d76"> months analysed</text>

      <text x="220" y="60" class="sans" font-size="22" font-weight="700" fill="#1a7f37">96.4%</text>
      <text x="290" y="60" class="sans" font-size="13" fill="#656d76"> fit</text>
    </g>

    <!-- Chart area -->
    <rect x="24" y="78" width="332" height="120" rx="6" fill="#ffffff" stroke="#e5e7eb"/>

    <!-- Grid lines -->
    <g stroke="#e5e7eb" stroke-dasharray="2 4" opacity=".6">
      <line x1="36" y1="108" x2="344" y2="108"/>
      <line x1="36" y1="138" x2="344" y2="138"/>
      <line x1="36" y1="168" x2="344" y2="168"/>
    </g>

    <!-- Historical / Forecast divider -->
    <line x1="220" y1="84" x2="220" y2="192" stroke="#d0d7de" stroke-dasharray="4 3"/>
    <text x="214" y="96" text-anchor="end" class="mono" font-size="9" fill="#afb8c1">history</text>
    <text x="226" y="96" class="mono" font-size="9" fill="#1a7f37">forecast</text>

    <!-- Historical sparkline (blue) -->
    <polyline class="spark" style="animation-duration:2s"
      points="40,172 72,160 104,164 138,146 170,150 200,136 220,138"
      fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Forecast sparkline (green, delayed) -->
    <polyline class="spark" style="animation-delay:.8s"
      points="220,138 248,131 276,124 304,118 328,112"
      fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Forecast area fill -->
    <path class="fadeUp d4"
      d="M 220 138 L 248 131 L 276 124 L 304 118 L 328 112 L 328 185 L 220 185 Z"
      fill="rgba(26,127,55,0.08)"/>

    <!-- Peak -->
    <g class="fadeUp d5">
      <circle cx="328" cy="112" r="4" fill="#1a7f37"/>
      <text x="328" y="102" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#1a7f37">6.22M MT</text>
    </g>

    <!-- Bottom label -->
    <text x="24" y="218" class="mono" font-size="10" fill="#656d76">
      SARIMA · Python · Statsmodels
    </text>
    <text x="356" y="218" text-anchor="end" class="mono" font-size="10" font-weight="600" fill="#32383f">
      Berth Planning
    </text>

    <!-- Certifications strip -->
    <g class="fadeUp d4">
      <line x1="24" y1="232" x2="356" y2="232" stroke="#e5e7eb"/>
      <text x="24" y="244" class="mono" font-size="9" fill="#afb8c1">
        HarvardX ML · Deloitte Analytics · Google AI · British Airways DS
      </text>
    </g>
  </g>
</svg>