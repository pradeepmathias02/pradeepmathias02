<svg xmlns="http://www.w3.org/2000/svg"
     width="960" height="380" viewBox="0 0 960 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Pradeep Mathias — Analytics Workspace</title>
  <desc id="description">
    A minimalist Figma-inspired analytics canvas featuring Pradeep Mathias's signature
    color tiles and an animated data workflow flowing from SQL and Python through
    EDA and SARIMA modeling into Power BI executive decisions.
  </desc>

  <defs>
    <!-- 40px Figma coordinate grid matching pradeep_workspace.fig dark theme -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2438" stroke-width="1"/>
    </pattern>

    <linearGradient id="pipelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="frame">
      <rect width="960" height="380" rx="18"/>
    </clipPath>

    <!-- Smooth analytical wave passing through all three stations -->
    <path id="route"
          d="M 35 256
             C 100 256, 138 244, 190 244
             C 278 244, 316 266, 375 256
             C 424 248, 446 244, 480 244
             C 556 244, 600 222, 666 234
             C 716 243, 740 244, 770 244"/>

    <!-- Reusable rotating telemetry ring -->
    <g id="nodeRing" fill="none" stroke="currentColor">
      <circle r="21" opacity=".45"/>
      <circle r="28" stroke-width="2.5" stroke-dasharray="36 12 5 8">
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle r="34" stroke-width="1.2" stroke-dasharray="6 20" opacity=".6">
        <animateTransform attributeName="transform" type="rotate"
                          from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Data pulse packet (clean diamond + cursor halo) -->
    <g id="pulse">
      <circle r="9" fill="#00E5FF" opacity=".35" filter="url(#glow)"/>
      <circle r="4.5" fill="#f4f4f5"/>
      <circle r="2.2" fill="#00E5FF"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Canvas Background & Grid -->
    <rect width="960" height="380" fill="#0f1219"/>
    <rect width="960" height="380" fill="url(#grid)"/>

    <!-- Top Workspace Chrome Bar -->
    <rect width="960" height="36" fill="#141a29"/>
    <line x1="0" y1="36" x2="960" y2="36" stroke="#232d42" stroke-width="1"/>
    <circle cx="24" cy="18" r="4" fill="#10B981"/>
    <text x="36" y="22" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
      pradeep_workspace.fig
    </text>
    <text x="480" y="22" text-anchor="middle" fill="#38bdf8"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11.5" letter-spacing="2.2">
      DATA ANALYST · MANGALURU
    </text>
    <text x="936" y="22" text-anchor="end" fill="#64748b"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
      Zoom 100%
    </text>

    <!-- Figma Selection Bounding Box around Hero Name -->
    <rect x="236" y="52" width="488" height="124"
          fill="#141a29" fill-opacity="0.52" stroke="#0070F3" stroke-width="1.5"/>

    <!-- Selection Handles -->
    <g fill="#0f1219" stroke="#38bdf8" stroke-width="1.5">
      <rect x="233" y="49" width="6" height="6"/>
      <rect x="477" y="49" width="6" height="6"/>
      <rect x="721" y="49" width="6" height="6"/>
      <rect x="233" y="111" width="6" height="6"/>
      <rect x="721" y="111" width="6" height="6"/>
      <rect x="233" y="173" width="6" height="6"/>
      <rect x="477" y="173" width="6" height="6"/>
      <rect x="721" y="173" width="6" height="6"/>
    </g>

    <!-- Dimension Pill -->
    <rect x="441" y="168" width="78" height="17" rx="3.5" fill="#0070F3"/>
    <text x="480" y="180" text-anchor="middle" fill="#ffffff"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" font-weight="700">
      488 × 124
    </text>

    <!-- Signature Tilted Color Tiles: P R A D E E P -->
    <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="27">
      <g transform="translate(330 89) rotate(-5)">
        <rect x="-21" y="-23" width="42" height="46" rx="7" fill="#00E5FF"/>
        <text y="10" fill="#090d16">P</text>
      </g>
      <g transform="translate(380 89) rotate(4)">
        <rect x="-21" y="-23" width="42" height="46" rx="7" fill="#FF2A4D"/>
        <text y="10" fill="#ffffff">R</text>
      </g>
      <g transform="translate(430 89) rotate(-4)">
        <rect x="-21" y="-23" width="42" height="46" rx="7" fill="#FFB703"/>
        <text y="10" fill="#090d16" font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</text>
      </g>
      <g transform="translate(480 89) rotate(3)">
        <rect x="-21" y="-23" width="42" height="46" rx="7" fill="#10B981"/>
        <text y="10" fill="#ffffff">D</text>
      </g>
      <g transform="translate(530 89) rotate(-4)">
        <rect x="-21" y="-23" width="42" height="46" rx="7" fill="#7B61FF"/>
        <text y="10" fill="#ffffff">E</text>
      </g>
      <g transform="translate(580 89) rotate(4)">
        <rect x="-21" y="-23" width="42" height="46" rx="7" fill="#F4F4F5"/>
        <text y="10" fill="#090d16">E</text>
      </g>
      <g transform="translate(630 89) rotate(-5)">
        <rect x="-21" y="-23" width="42" height="46" rx="7" fill="#FF007A"/>
        <text y="10" fill="#ffffff">P</text>
      </g>
    </g>

    <!-- MATHIAS -->
    <text x="480" y="152" text-anchor="middle" fill="#f4f4f5"
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="28" font-weight="800" letter-spacing="5">
      MATHIAS
    </text>

    <!-- Subtle Analytical Baseline -->
    <line x1="60" y1="244" x2="900" y2="244" stroke="#232d42" stroke-width="1" stroke-dasharray="4 6"/>

    <!-- Animated Signal Curve -->
    <g fill="none" stroke-linecap="round">
      <use href="#route" stroke="url(#pipelineGrad)" stroke-width="8" opacity=".22" filter="url(#glow)"/>
      <use href="#route" stroke="url(#pipelineGrad)" stroke-width="2"/>
      <use href="#route" stroke="#e2f8ff" stroke-width="2.5" stroke-dasharray="2 30">
        <animate attributeName="stroke-dashoffset" from="32" to="0" dur="0.9s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- Station 1: SQL & Python -->
    <g transform="translate(190 244)" color="#00E5FF">
      <use href="#nodeRing"/>
      <circle r="15" fill="currentColor" opacity=".12">
        <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
                 values=".12;.12;.85;.12;.12" keyTimes="0;.12;.18;.26;1"/>
      </circle>
      <!-- Minimal database icon -->
      <ellipse cx="0" cy="-6" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M-8 -6 V5 C-8 7.5 8 7.5 8 5 V-6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M-8 -0.5 C-8 2 8 2 8 -0.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </g>

    <!-- Station 2: EDA & SARIMA -->
    <g transform="translate(480 244)" color="#7B61FF">
      <use href="#nodeRing"/>
      <circle r="15" fill="currentColor" opacity=".12">
        <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
                 values=".12;.12;.85;.12;.12" keyTimes="0;.38;.44;.52;1"/>
      </circle>
      <!-- Minimal trend-wave icon -->
      <path d="M-10 4 L-4 -3 L2 2 L10 -6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="10" cy="-6" r="2" fill="currentColor"/>
    </g>

    <!-- Station 3: Power BI & ROI -->
    <g transform="translate(770 244)" color="#10B981">
      <use href="#nodeRing"/>
      <circle r="15" fill="currentColor" opacity=".12">
        <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
                 values=".12;.12;.90;.12;.12" keyTimes="0;.65;.71;.82;1"/>
      </circle>
      <!-- Minimal decision check icon -->
      <path d="M-7 0.5 L-2 5.5 L8 -5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Traveling Data Pulse -->
    <g>
      <animateMotion dur="7.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.71;1">
        <mpath href="#route"/>
      </animateMotion>
      <use href="#pulse">
        <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
                 values="1;1;0;0" keyTimes="0;.70;.73;1"/>
      </use>
    </g>

    <!-- Beams from Station 3 to Growing Executive KPI Bars -->
    <g fill="none" stroke-width="1.8" stroke-dasharray="100 101" stroke-dashoffset="100">
      <path d="M770 244 Q806 254 842 246" stroke="#00E5FF" pathLength="100"/>
      <path d="M770 244 Q816 238 866 226" stroke="#7B61FF" pathLength="100"/>
      <path d="M770 244 Q826 220 890 206" stroke="#10B981" pathLength="100"/>
      <animate attributeName="stroke-dashoffset" dur="7.5s" repeatCount="indefinite"
               values="100;100;0;0;100" keyTimes="0;.71;.79;.94;1"/>
    </g>

    <g fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="100 101" stroke-dashoffset="100">
      <path d="M842 272 V248" pathLength="100" stroke="#00E5FF"/>
      <path d="M866 272 V228" pathLength="100" stroke="#7B61FF"/>
      <path d="M890 272 V208" pathLength="100" stroke="#10B981"/>
      <animate attributeName="stroke-dashoffset" dur="7.5s" repeatCount="indefinite"
               values="100;100;0;0;100" keyTimes="0;.75;.85;.95;1"/>
    </g>

    <!-- Peak Accuracy Readout -->
    <text x="866" y="194" text-anchor="middle" fill="#10B981" opacity="0"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">
      96.4% FIT
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;.78;.84;.95;1"/>
    </text>

    <!-- Station Labels -->
    <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#e2e8f0">
      <text x="190" y="302">SQL · Python</text>
      <text x="480" y="302">EDA · SARIMA</text>
      <text x="770" y="302">Power BI · ROI</text>
    </g>

    <!-- Bottom Status Strip -->
    <rect y="328" width="960" height="52" fill="#141a29"/>
    <line x1="0" y1="328" x2="960" y2="328" stroke="#232d42" stroke-width="1"/>
    <text x="24" y="359" fill="#64748b"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
      STATUS
    </text>
    <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">
      <text x="480" y="359" fill="#00E5FF">
        01 · INGESTING 58 MO PORT &amp; RETAIL TELEMETRY
        <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
                 values="1;0;0" keyTimes="0;.36;1" calcMode="discrete"/>
      </text>
      <text x="480" y="359" fill="#a78bfa" opacity="0">
        02 · MODELING SARIMA FORECASTS &amp; COHORTS
        <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
                 values="0;1;0;0" keyTimes="0;.36;.71;1" calcMode="discrete"/>
      </text>
      <text x="480" y="359" fill="#10B981" opacity="0">
        03 · EXECUTIVE KPI SUITE &amp; ROI READY ✓
        <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite"
                 values="0;1;1" keyTimes="0;.71;1" calcMode="discrete"/>
      </text>
    </g>
    <text x="936" y="359" text-anchor="end" fill="#64748b"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
      60fps
    </text>

    <!-- Crisp Outer Border -->
    <rect x="0.5" y="0.5" width="959" height="379" rx="18" fill="none" stroke="#232d42" stroke-width="1"/>
  </g>
</svg>
